
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmbiNav</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f7f7f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 80px 25px;
            text-align: center;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 24px;
            color: #555;
            margin-bottom: 35px;
        }

        .description {
            max-width: 650px;
            margin: auto;
            font-size: 18px;
            line-height: 1.7;
        }

        .status {
            margin-top: 45px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AmbiNav</h1>

        <div class="tagline">
            Smart indoor navigation for malls.
        </div>

        <p class="description">
            AmbiNav is an early-stage project exploring better ways
            for visitors to navigate large shopping malls, discover
            stores and services, and reach their destinations more easily.
        </p>

        <p class="status">
            Early-stage project — currently under development.
        </p>
    </div>

</body>
</html>
